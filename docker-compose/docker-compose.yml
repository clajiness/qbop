services:
  qbop:
    image: ghcr.io/clajiness/qbop:latest
    container_name: qbop
    restart: unless-stopped
    ports:
      - "4567:4567"
    volumes:
      - data:/opt/qbop/data/
      - log:/opt/qbop/log/
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # Configure integrations in the Settings UI; optional ENV overrides are documented in README.md.
    environment:
      - WEB_AUTH_ENABLED=true

volumes:
  data:
  log:
