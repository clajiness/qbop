name: qbop_ci

on:
  push:
    branches:
      - "**"

jobs:
  build:
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read file contents
        uses: guibranco/github-file-reader-action-v2@a582a1e72db30a1f4d88d386509e465a9492e352 # v2.3.12
        id: file-contents
        with:
          path: "version.yml"

      - name: Parse version
        id: version
        shell: bash
        run: |
          VERSION="$(echo '${{ steps.file-contents.outputs.contents }}' | tr -d '\r\n' | xargs)"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Check if full tag exists
        uses: action-pack/tag-exists@d737dc8748d10e12ac894f86e846de514e6c1f1a # v1.08
        id: check-tag
        with:
          tag: ${{ steps.version.outputs.full }}

      - name: Docker metadata for non-main
        if: github.ref != 'refs/heads/main' && (steps.check-tag.outputs.exists == 'false' || steps.check-tag.outputs.exists == '')
        id: meta_non_main
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
          labels: |
            org.opencontainers.image.title=qbop
            org.opencontainers.image.description=A lightweight Sinatra + Grape app with uptime tracking and API support
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Docker metadata for main
        if: github.ref == 'refs/heads/main' && (steps.check-tag.outputs.exists == 'false' || steps.check-tag.outputs.exists == '')
        id: meta_main
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.full }}
          labels: |
            org.opencontainers.image.title=qbop
            org.opencontainers.image.description=A lightweight Sinatra + Grape app with uptime tracking and API support
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push to non-main
        if: github.ref != 'refs/heads/main' && (steps.check-tag.outputs.exists == 'false' || steps.check-tag.outputs.exists == '')
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.full }}
          platforms: linux/amd64,linux/arm64/v8
          push: true
          provenance: false
          tags: ${{ steps.meta_non_main.outputs.tags }}
          labels: ${{ steps.meta_non_main.outputs.labels }}

      - name: Build and push to main
        if: github.ref == 'refs/heads/main' && (steps.check-tag.outputs.exists == 'false' || steps.check-tag.outputs.exists == '')
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: |
            VERSION=${{ steps.version.outputs.full }}
          platforms: linux/amd64,linux/arm64/v8
          push: true
          provenance: false
          tags: ${{ steps.meta_main.outputs.tags }}
          labels: ${{ steps.meta_main.outputs.labels }}
