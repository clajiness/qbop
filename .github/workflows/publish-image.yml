name: Build and publish validated image

on:
  workflow_call:
    inputs:
      security:
        type: boolean
        default: false
      release:
        type: string
        default: ''
      commit:
        type: string
        default: ''
      base_image:
        type: string
        default: ''
      base_digest:
        type: string
        default: ''
      force:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Serialize builds too: fewer jobs and no competing candidates to reconcile.
    concurrency:
      group: qbop-release-publish
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_KIND: ${{ inputs.security && 'security' || 'normal' }}
      RELEASE_TAG: ${{ inputs.release }}
      SOURCE_SHA: ${{ inputs.commit || github.sha }}
      BASE_IMAGE: ${{ inputs.base_image }}
      BASE_DIGEST: ${{ inputs.base_digest }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout maintained publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          working-directory: automation
          ruby-version: .ruby-version
      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check eligibility and prepare build inputs
        id: prepare
        run: ruby automation/.github/scripts/image_publisher.rb prepare
      - name: Build unique staging image
        if: steps.prepare.outputs.proceed == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          platforms: linux/amd64,linux/arm64/v8
          pull: true
          no-cache: ${{ inputs.security }}
          cache-from: ${{ !inputs.security && 'type=gha,scope=qbop' || '' }}
          cache-to: ${{ !inputs.security && 'type=gha,scope=qbop,mode=max' || '' }}
          push: true
          provenance: false
          tags: ${{ steps.prepare.outputs.image }}:staging-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BASE_IMAGE=${{ steps.prepare.outputs.base }}
            VERSION=${{ steps.prepare.outputs.version }}
            COMMIT_SHA=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ steps.prepare.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ steps.prepare.outputs.date }}
            org.opencontainers.image.base.name=${{ inputs.base_image }}
            org.opencontainers.image.base.digest=${{ inputs.base_digest }}
      - name: Validate, promote and verify
        if: steps.prepare.outputs.proceed == 'true'
        env:
          STAGED_DIGEST: ${{ steps.build.outputs.digest }}
        run: ruby automation/.github/scripts/image_publisher.rb publish
