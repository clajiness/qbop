name: Upstream security rebuild

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the upstream digest is unchanged
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      release: ${{ steps.check.outputs.release }}
      commit: ${{ steps.check.outputs.commit }}
      base_image: ${{ steps.check.outputs.base_image }}
      base_digest: ${{ steps.check.outputs.base_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: .ruby-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check stable release and upstream digest
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: ruby .github/scripts/image_publisher.rb check

  publish:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      security: true
      release: ${{ needs.check.outputs.release }}
      commit: ${{ needs.check.outputs.commit }}
      base_image: ${{ needs.check.outputs.base_image }}
      base_digest: ${{ needs.check.outputs.base_digest }}
      force: ${{ inputs.force || false }}
